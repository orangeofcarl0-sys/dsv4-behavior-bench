# One-shot behavior-bench harness overlay (effort=max)
# Same model as the host conversation: OpenCode Zen / space-bunny-free.
- id: agent-default-model
  config:
    provider: opencode-zen
    model: space-bunny-free
    reasoningEffort: max

- id: llm-pi-ai
  config:
    providers:
      opencode-zen:
        displayName: OpenCode Zen
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/v1
        retryPolicy:
          mode: normal
          maxRetries: 20
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: space-bunny-free
            name: Space Bunny Free (OpenCode Zen)
            contextWindow: 1048576
            maxTokens: 524288
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max

# Blind run: no outbound web, no subagents — the candidate may only see its own workspace.
- id: tool-web
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
